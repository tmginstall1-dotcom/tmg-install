name: Sign frozen TMG compiled APK (artifacts only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmg-staff-sign-only-${{ github.ref }}
  cancel-in-progress: false

env:
  REVIEWED_VERIFIER_SHA256: daa2cee2521903bf4ea7973fc98f12ea65aea3645ff35e48a9b3699e7d30cf98
  REVIEWED_CONTRACT_SHA256: 777cb3392a41e6f25565b887b568077d8ec484a6e23f50b059ebceff97d2e386

jobs:
  sign:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'tmginstall1-dotcom/tmg-install' &&
      github.ref == 'refs/heads/codex/staff-operations-2026-10-20'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out only the reviewed verifier, frozen contract and exact compiled APK
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/verify-signing-only-apk.py
            /.github/signing-only-contract.json
            /build-inputs/tmg-staff-reviewed-unsigned.apk

      - name: Check independent pins and exact APK before network tools or signing material
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, os, pathlib, re
          for variable, filename in (
              ('REVIEWED_VERIFIER_SHA256', '.github/scripts/verify-signing-only-apk.py'),
              ('REVIEWED_CONTRACT_SHA256', '.github/signing-only-contract.json'),
          ):
              pin = os.environ[variable]
              if not re.fullmatch('[0-9a-f]{64}', pin):
                  raise SystemExit('Independent review pin is missing: ' + variable)
              path = pathlib.Path(filename)
              if not path.is_file() or path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != pin:
                  raise SystemExit('Reviewed file differs from its pin: ' + filename)
          spec = importlib.util.spec_from_file_location('reviewed_verifier', '.github/scripts/verify-signing-only-apk.py')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          c = verifier.load_contract('.github/signing-only-contract.json')
          if c['transfer_kind'] != 'repository_apk':
              raise SystemExit('This manual workflow only accepts the frozen repository APK.')
          apk = pathlib.Path('build-inputs/tmg-staff-reviewed-unsigned.apk')
          if not apk.is_file() or apk.is_symlink() or not 0 < apk.stat().st_size <= verifier.MAX_APK:
              raise SystemExit('Exact reviewed unsigned APK is missing or unsafe.')
          if hashlib.sha256(apk.read_bytes()).hexdigest() != c['unsigned_sha256']:
              raise SystemExit('Unsigned APK differs from its independently frozen hash.')
          verifier.zip_payload(apk)
          print('Frozen verifier, contract and exact compiled APK verified; no application source executed.')
          PY

      - name: Set up Java 21 for Android signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android tools
        uses: android-actions/setup-android@v3

      - name: Install reviewed Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Inspect package, version, API and final repair markers before keys, then align
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-signing-only-apk.py inspect \
            --contract .github/signing-only-contract.json \
            --apk build-inputs/tmg-staff-reviewed-unsigned.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --report "$RUNNER_TEMP/tmg-unsigned-inspection.json"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 \
            build-inputs/tmg-staff-reviewed-unsigned.apk "$RUNNER_TEMP/tmg-aligned-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/tmg-aligned-unsigned.apk"
          python3 .github/scripts/verify-signing-only-apk.py inspect --aligned \
            --contract .github/signing-only-contract.json \
            --apk "$RUNNER_TEMP/tmg-aligned-unsigned.apk" \
            --original build-inputs/tmg-staff-reviewed-unsigned.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --report "$RUNNER_TEMP/tmg-aligned-inspection.json"

      - name: Decode existing signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tmg-sign-only.keystore"
          test -s "$RUNNER_TEMP/tmg-sign-only.keystore"

      - name: Sign the inspected aligned APK without running application build code
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tmg-sign-only.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/tmg-reviewed-signed.apk" "$RUNNER_TEMP/tmg-aligned-unsigned.apk"

      - name: Verify exact existing signer, unchanged payload, final identity and alignment
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-signing-only-apk.py inspect \
            --contract .github/signing-only-contract.json \
            --apk "$RUNNER_TEMP/tmg-reviewed-signed.apk" \
            --original build-inputs/tmg-staff-reviewed-unsigned.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --report "$RUNNER_TEMP/tmg-signed-verification.json"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/tmg-reviewed-signed.apk"

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/tmg-sign-only.keystore"

      - name: Upload verified signed APK and bounded reports only
        uses: actions/upload-artifact@v4
        with:
          name: tmg-staff-sign-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tmg-reviewed-signed.apk
            ${{ runner.temp }}/tmg-unsigned-inspection.json
            ${{ runner.temp }}/tmg-aligned-inspection.json
            ${{ runner.temp }}/tmg-signed-verification.json
          if-no-files-found: error
          retention-days: 14
