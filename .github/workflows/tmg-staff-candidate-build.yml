            --archive-sha256 "$REVIEWED_ARCHIVE_SHA256" \
            --base-commit "$REVIEWED_SOURCE_COMMIT" \
            --delta reviewed-source-delta.json \
            --delta-sha256 7849b7c20cca65283ca0a07875401ba79529719968dcc468e4886ef27409ae54 \
            --final-manifest reviewed-final-manifest.json \
